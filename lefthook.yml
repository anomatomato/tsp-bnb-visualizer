pre-commit:
  parallel: true
  jobs:
    - name: python pre-commit
      run: uv run pre-commit run --files {staged_files} # --files flag disables pre-commit's own stash
    - name: frontend lint
      root: frontend/
      glob: "*.{js,mjs,ts,tsx,jsx}"
      run: pnpm exec eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    - name: frontend format
      root: frontend/
      glob: "*.{js,mjs,ts,tsx,jsx,css,json,html,md,yaml}"
      run: pnpm exec prettier --write -- {staged_files}
      stage_fixed: true

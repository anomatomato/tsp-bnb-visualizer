[project]
name = "bnb-visualizer"
version = "0.1.0"
description = "A generic branch-and-bound visualizer, e.g. for TSP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "highspy>=1.15.1",
  "matplotlib>=3.11.1",
  "networkx>=3.6.1",
  "pydantic>=2.13.4",
  "scipy>=1.18.0",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]
lint = [
  "pre-commit>=4.5.1",
  "pyrefly>=1.1.1",
]
types = [
  "pydantic-to-typescript>=2.0.0",
  "types-networkx>=3.6.1.20260724",
]

test = [
  "hypothesis>=6.164.0",
  "pytest>=9.1.1",
]

[tool.pyrefly]
# project-includes = [
#   "tsp_bnb",
# ]
search-path = [
  "tsp_bnb",
]

[tool.pyright]
extraPaths = ["tsp_bnb"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (HiGHS-dependent)",
]
pythonpath = ["tsp_bnb"]
testpaths = ["tests"]

[project]
name = "bnb-visualizer"
version = "0.1.0"
description = "A generic branch-and-bound visualizer, e.g. for TSP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "highspy>=1.15.1",
  "networkx>=3.6.1",
  "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
  "pyrefly>=1.1.1",
  "types-networkx>=3.6.1.20260724",
]

[tool.pyrefly]
# project-includes = [
#   "tsp-bnb",
# ]
search-path = [
  "tsp-bnb",
]
